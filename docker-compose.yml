# MeTube 视频下载：yt-dlp 的网页前端，文件写进共享文件夹 downloads。
# 上游 ghcr.io/alexta69/metube，AGPL-3.0-only，镜像按清单列表（index）的摘要固定。
# 镜像不依赖 root：入口脚本检测到非 root 用户时直接按容器用户运行（PUID/PGID 只在 root 时生效）。
services:
  metube:
    image: ghcr.io/alexta69/metube:2026.11.06@sha256:96dfbf0d5b2944e4ee38f6ce1b34bb0e75a1a3c74eaefd93424ed11284cb72b2
    user: "${PUID}:${PGID}"
    # 临时目录和状态目录独立出来，共享文件夹里只留下载的文件。
    environment:
      DOWNLOAD_DIR: /downloads
      STATE_DIR: /data/.metube
      TEMP_DIR: /data/tmp
      # 上游默认 auto（跟随浏览器深浅色），不用改；界面无多语言，固定英文，见 README。
      TZ: ${TZ}
    volumes:
      - ${WONTON_SHARE_DOWNLOADS}:/downloads
      - ${WONTON_APP_DATA}/data:/data
    healthcheck:
      # 镜像自带的健康检查命令是 curl；这里显式写全，检查的是网页真的能响应。
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

x-wonton:
  spec: "0.4"
  id: app.github.alexta69.metube
  version: 0.1.0
  kind: app
  title: { zh: 视频下载器（MeTube）, en: Video Downloader (MeTube) }
  description: { zh: 贴一个视频网址，它就把视频下载到共享文件夹 downloads：支持几百个网站，能选画质，也能只要声音。适合看到好视频想随手存一个的人。, en: "Paste a video link and it saves the video to the downloads shared folder on your home server — hundreds of sites supported, with a choice of quality or audio only. For saving a video you like, one at a time." }
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://github.com/alexta69/metube
  # 应用（MeTube）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: AGPL-3.0-only
  tags:
    zh: [下载, 视频]
    en: [Download, Video]
  about:
    zh: |
      贴上视频或播放列表的网址就能下载，文件直接存进共享文件夹 downloads，其他应用（家庭影院、文件管理）都能读到。

      支持几百个网站，可选画质和格式（视频、纯音频），下载队列和进度都在网页上看。打开就用，不用再登录一次；外网的下载站需要能访问。
    en: |
      Paste a video or playlist link to download it straight into the downloads shared folder, where other apps (Jellyfin, the file manager) can read it.

      Hundreds of sites are supported, with quality and format options (video or audio-only); the queue and progress show on the page. Opening it is enough, there is no second login. Downloading needs internet access.
  release_notes: { zh: 第一版。, en: First release. }
  webui:
    service: metube
    port: 8081
    # 上游没有登录，也不认 OIDC 或反向代理头；sso: none 时网关仍先校验云吞会话才转发。
    sso: none
  permissions:
    # 下载就是从外网拉视频。
    - network.egress
    # 下载的文件写进共享文件夹 downloads，其他应用和主人都能读。
    - storage.share.downloads:write
  # 镜像支持 amd64 和 arm64（docker buildx imagetools inspect）。上游没写最低内存；
  # 本机空闲实测 124M（2026-11-05，一个 19 秒视频下载完成后），取 256M 留并发余量。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
